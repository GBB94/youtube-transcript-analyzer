[project]
name = "transcript-tool"
version = "0.1.0"
description = "Staged, policy-driven video transcript acquisition (Phase 1 starter)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
captions = ["youtube-transcript-api>=0.6"]   # Phase 2
media = ["yt-dlp>=2025.11.12"]               # Phase 3 (needs a JS runtime + EJS; PO-token plugin pinned separately)
asr = ["faster-whisper>=1.0"]                # Phase 4
asr_test = ["jiwer>=3.0"]                    # Phase 4 regression
managed = ["httpx>=0.27"]                    # Phase 5 managed providers
discovery = ["google-api-python-client>=2.0"] # Phase 6
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]  # batch web UI (UI-1+)
retrieval = ["lancedb>=0.15", "tiktoken>=0.7"]        # R0-R6 corpus & query (one store)
embed = ["sentence-transformers>=3.0"]                # local embedder + cross-encoder reranker
rerank = ["sentence-transformers>=3.0"]               # alias — same library provides both
embed_api = ["voyageai>=0.3"]                         # optional API embedder (egress)
answer = ["anthropic>=0.40"]                          # contextual enrichment + grounded answering
diarize = ["pyannote.audio>=3.1"]                     # R7 per-episode speaker segmentation
cli = ["rich>=13.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
transcript = "transcript_tool.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"transcript_tool.web" = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Correctness-first: pyflakes + the pycodestyle error classes + bugbear.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]  # FastAPI's Form(...) default-call idiom

[tool.ruff.lint.per-file-ignores]
# Test idioms predating ruff: blind pytest.raises, compact fixtures, `l` for label.
"tests/*" = ["B017", "E701", "E741"]

[tool.mypy]
python_version = "3.11"
files = ["src/transcript_tool"]
ignore_missing_imports = true
check_untyped_defs = true
